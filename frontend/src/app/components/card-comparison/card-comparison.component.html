<div class="section">
  <h2>Card comparison</h2>
  <div class="comparison-grid">
    <div class="card comparison-card" *ngFor="let card of cards">
      <div class="split">
        <h3>{{ card.name }}</h3>
        <span class="pill">{{ card.issuer }}</span>
      </div>
      <div class="comparison-detail">
        <span class="label">Annual fee</span>
        <span>{{ formatFee(card.annualFee) }}</span>
      </div>
      <div class="comparison-detail">
        <span class="label">Network</span>
        <span>{{ card.type }}</span>
      </div>
      <div class="comparison-detail">
        <span class="label">Top rewards</span>
        <span class="muted">
          {{ getTopRewards(card) }}
        </span>
      </div>
    </div>
  </div>
</div>
