<section class="page">
  <div class="page-header">
    <div>
      <h1>Benefits overview</h1>
      <p class="muted">Review rewards, credits, and perks side by side.</p>
    </div>
  </div>

  <div *ngIf="isLoading" class="card">Loading benefits...</div>
  <div *ngIf="errorMessage" class="card error">{{ errorMessage }}</div>

  <ng-container *ngIf="!isLoading && !errorMessage">
    <app-card-comparison [cards]="selectedCards"></app-card-comparison>

    <div class="section">
      <h2>Selected card benefits</h2>
      <div class="card-grid">
        <div class="card category-card" *ngFor="let card of selectedCards">
          <div class="benefit-header">
            <img [src]="getImageUrl(card)" [alt]="card.name" class="benefit-image" />
            <div class="benefit-title-block">
              <h3>{{ card.name }}</h3>
              <div class="muted">{{ card.issuer }}</div>
            </div>
            <span class="pill">{{ card.type }}</span>
          </div>
          <div class="benefit">
            <div class="benefit-title">Annual fee</div>
            <div class="muted">{{ card.annualFee }}</div>
          </div>
          <div class="benefit">
            <div class="benefit-title">Key benefits</div>
            <div class="muted">{{ card.description }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</section>
